<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SavvEat</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="container">
            <nav class="navbar">
                <div class="logo">
                    <h2>Savv<span>Eat</span></h2>
                </div>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="#features">Features</a></li>
                    <li><a href="#how-it-works">How It Works</a></li>
                    <li><a href="#testimonials">Testimonials</a></li>
                    <li><a href="#download">Download</a></li>
                </ul>
                <div class="hamburger">
                    <i class="fas fa-bars"></i>
                </div>
            </nav>
        </div>
    </header>

    <!-- Personalized Plans Section -->
    <section class="personalized-plans">
        <div class="container">
            <div class="plans-header">
                <h1>Weekly Meal Schedule</h1>
            </div>

            <!-- Date Selector -->
            <div class="date-selector-container">
                <div class="date-selector" id="dateSelector">
                    <!-- Dates will be injected here by JS -->
                </div>
            </div>

            <div class="meal-schedule-content">
                <!-- Breakfast -->
                <div class="meal-category">
                    <h2>Breakfast</h2>
                    <div class="meal-options-container">
                        <div class="meal-options" id="breakfastOptions">
                            <!-- Options injected by JS -->
                        </div>
                    </div>
                </div>

                <!-- Lunch -->
                <div class="meal-category">
                    <h2>Lunch</h2>
                    <div class="meal-options-container">
                        <div class="meal-options" id="lunchOptions">
                            <!-- Options injected by JS -->
                        </div>
                    </div>
                </div>

                <!-- Dinner -->
                <div class="meal-category">
                    <h2>Dinner</h2>
                    <div class="meal-options-container">
                        <div class="meal-options" id="dinnerOptions">
                            <!-- Options injected by JS -->
                        </div>
                    </div>
                </div>
            </div>

            <div class="schedule-actions">
                <button type="button" id="btnApply" class="btn-secondary">Save for Today</button>
                <a href="schedule.html" id="btnProceed" class="btn-primary">View Full Schedule</a>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const dateSelector = document.getElementById('dateSelector');
            const breakfastOptions = document.getElementById('breakfastOptions');
            const lunchOptions = document.getElementById('lunchOptions');
            const dinnerOptions = document.getElementById('dinnerOptions');
            const btnApply = document.getElementById('btnApply');

            let currentDate = '';
            let scheduleData = JSON.parse(localStorage.getItem('savvEatSchedule')) || {};

            // Generate dates for the next 7 days
            const today = new Date();
            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            
            // Check for date in URL parameters
            const urlParams = new URLSearchParams(window.location.search);
            const urlDate = urlParams.get('date');
            
            for (let i = 0; i < 7; i++) {
                const date = new Date(today);
                date.setDate(today.getDate() + i);
                
                const dayName = days[date.getDay()];
                const dayNum = String(date.getDate()).padStart(2, '0');
                const monthNum = String(date.getMonth() + 1).padStart(2, '0');
                const dateString = `${dayNum}/${monthNum} (${dayName})`;
                const dateKey = `${date.getFullYear()}-${monthNum}-${dayNum}`;

                const dateBtn = document.createElement('button');
                
                // Determine if this button should be active
                let isActive = false;
                if (urlDate) {
                    isActive = (dateKey === urlDate);
                } else {
                    isActive = (i === 0);
                }
                
                dateBtn.className = 'date-btn' + (isActive ? ' active' : '');
                dateBtn.textContent = dateString;
                dateBtn.dataset.date = dateKey;
                
                if (isActive) currentDate = dateKey;

                dateBtn.addEventListener('click', function() {
                    document.querySelectorAll('.date-btn').forEach(btn => btn.classList.remove('active'));
                    this.classList.add('active');
                    currentDate = this.dataset.date;
                    document.getElementById('btnProceed').href = `schedule.html?date=${currentDate}`;
                    renderMeals();
                });

                dateSelector.appendChild(dateBtn);
            }
            
            // If urlDate was provided but not found in the next 7 days, default to today
            if (!currentDate) {
                const firstBtn = dateSelector.querySelector('.date-btn');
                if (firstBtn) {
                    firstBtn.classList.add('active');
                    currentDate = firstBtn.dataset.date;
                }
            }
            
            // Set initial href for the proceed button
            document.getElementById('btnProceed').href = `schedule.html?date=${currentDate}`;

            // Mock data for meals
            const meals = {
                breakfast: [
                    { id: 'b1', name: 'Oatmeal with Berries', image: 'https://images.unsplash.com/photo-1517673132405-a56a62b18caf?w=300&h=200&fit=crop' },
                    { id: 'b2', name: 'Avocado Toast', image: 'https://images.unsplash.com/photo-1603048297172-c92544798d5e?w=300&h=200&fit=crop' },
                    { id: 'b3', name: 'Pancakes', image: 'https://images.unsplash.com/photo-1528207776546-365bb710ee93?w=300&h=200&fit=crop' }
                ],
                lunch: [
                    { id: 'l1', name: 'Grilled Chicken Salad', image: 'https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=300&h=200&fit=crop' },
                    { id: 'l2', name: 'Quinoa Bowl', image: 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=300&h=200&fit=crop' },
                    { id: 'l3', name: 'Turkey Wrap', image: 'https://images.unsplash.com/photo-1626804475297-41601ea0ba49?w=300&h=200&fit=crop' }
                ],
                dinner: [
                    { id: 'd1', name: 'Fried rice noodle with shrimp', image: 'https://images.unsplash.com/photo-1552611052-33e04de081de?w=300&h=200&fit=crop' },
                    { id: 'd2', name: 'Grilled Steak (with Asparagus)', image: 'https://images.unsplash.com/photo-1600891964092-4316c288032e?w=300&h=200&fit=crop' },
                    { id: 'd3', name: 'Japanese Miso Soup with Tofu', image: 'https://images.unsplash.com/photo-1547592166-23ac45744acd?w=300&h=200&fit=crop' },
                    { id: 'd4', name: 'Rigatoni Pasta with Tomato Sauce', image: 'https://images.unsplash.com/photo-1621996346565-e3dbc646d9a9?w=300&h=200&fit=crop' }
                ]
            };

            function renderMealOptions(category, container, options) {
                container.innerHTML = '';
                const savedSelection = scheduleData[currentDate]?.[category] || '';

                options.forEach(option => {
                    const label = document.createElement('label');
                    label.className = 'meal-card';
                    
                    const input = document.createElement('input');
                    input.type = 'radio';
                    input.name = `meal_${category}`;
                    input.value = option.id;
                    input.className = 'meal-radio';
                    if (savedSelection === option.id) input.checked = true;

                    label.addEventListener('mousedown', function(e) {
                        if (input.checked) {
                            e.preventDefault();
                            input.checked = false;
                            if (scheduleData[currentDate] && scheduleData[currentDate][category] === option.id) {
                                delete scheduleData[currentDate][category];
                                localStorage.setItem('savvEatSchedule', JSON.stringify(scheduleData));
                            }
                            renderMeals();
                        }
                    });

                    const cardContent = document.createElement('div');
                    cardContent.className = 'meal-card-content';

                    const img = document.createElement('img');
                    img.src = option.image;
                    img.alt = option.name;

                    const nameDiv = document.createElement('div');
                    nameDiv.className = 'meal-name';
                    nameDiv.textContent = option.name;

                    cardContent.appendChild(img);
                    cardContent.appendChild(nameDiv);
                    label.appendChild(input);
                    label.appendChild(cardContent);
                    container.appendChild(label);
                });
            }

            function renderMeals() {
                // Always fetch fresh data from localStorage to handle back-button navigation
                scheduleData = JSON.parse(localStorage.getItem('savvEatSchedule')) || {};
                renderMealOptions('breakfast', breakfastOptions, meals.breakfast);
                renderMealOptions('lunch', lunchOptions, meals.lunch);
                renderMealOptions('dinner', dinnerOptions, meals.dinner);
            }

            // Initial render
            renderMeals();

            // Handle Apply button
            btnApply.addEventListener('click', function() {
                const selectedBreakfast = document.querySelector('input[name="meal_breakfast"]:checked')?.value;
                const selectedLunch = document.querySelector('input[name="meal_lunch"]:checked')?.value;
                const selectedDinner = document.querySelector('input[name="meal_dinner"]:checked')?.value;

                if (!scheduleData[currentDate]) {
                    scheduleData[currentDate] = {};
                }

                if (selectedBreakfast) scheduleData[currentDate].breakfast = selectedBreakfast;
                if (selectedLunch) scheduleData[currentDate].lunch = selectedLunch;
                if (selectedDinner) scheduleData[currentDate].dinner = selectedDinner;

                localStorage.setItem('savvEatSchedule', JSON.stringify(scheduleData));
                
                // Optional: Show a brief success indication
                const originalText = btnApply.textContent;
                btnApply.textContent = 'Saved!';
                btnApply.style.backgroundColor = '#2E7D32';
                btnApply.style.borderColor = '#2E7D32';
                setTimeout(() => {
                    btnApply.textContent = originalText;
                    btnApply.style.backgroundColor = '';
                    btnApply.style.borderColor = '';
                }, 2000);
            });
        });
    </script>
</body>
</html>
