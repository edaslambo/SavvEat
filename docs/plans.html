<!DOCTYPE html>
<html lang="en">
<head>    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SavvEat</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="container">
            <nav class="navbar">
                <div class="logo">
                    <h2>Savv<span>Eat</span></h2>
                </div>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="#features">Features</a></li>
                    <li><a href="#how-it-works">How It Works</a></li>
                    <li><a href="#testimonials">Testimonials</a></li>
                    <li><a href="#download">Download</a></li>
                </ul>
                <div class="hamburger">
                    <i class="fas fa-bars"></i>
                </div>
            </nav>
        </div>
    </header>

    <!-- Personalized Plans Section -->
    <section class="personalized-plans">
        <div class="container">
            <div class="plans-header">
                <h1>Weekly Meal Schedule</h1>
            </div>

            <!-- Date Selector -->
            <div class="date-selector-container">
                <div class="date-selector" id="dateSelector">
                    <!-- Dates will be injected here by JS -->
                </div>
            </div>

            <div class="meal-schedule-content">
                <!-- Breakfast -->
                <div class="meal-category">
                    <h2>Breakfast</h2>
                    <div class="meal-options-container">
                        <div class="meal-options" id="breakfastOptions">
                            <!-- Options injected by JS -->
                        </div>
                    </div>
                </div>

                <!-- Lunch -->
                <div class="meal-category">
                    <h2>Lunch</h2>
                    <div class="meal-options-container">
                        <div class="meal-options" id="lunchOptions">
                            <!-- Options injected by JS -->
                        </div>
                    </div>
                </div>

                <!-- Dinner -->
                <div class="meal-category">
                    <h2>Dinner</h2>
                    <div class="meal-options-container">
                        <div class="meal-options" id="dinnerOptions">
                            <!-- Options injected by JS -->
                        </div>
                    </div>
                </div>
            </div>

            <div class="schedule-actions">
                <button type="button" id="btnApply" class="btn-secondary">Save for Today</button>
                <a href="schedule.html" id="btnProceed" class="btn-primary">View Full Schedule</a>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
    <!-- <script src="plans.js"></script> -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const dateSelector = document.getElementById('dateSelector');
            const breakfastOptions = document.getElementById('breakfastOptions');
            const lunchOptions = document.getElementById('lunchOptions');
            const dinnerOptions = document.getElementById('dinnerOptions');
            const btnApply = document.getElementById('btnApply');

            let currentDate = '';
            let scheduleData = JSON.parse(localStorage.getItem('savvEatSchedule')) || {};

            // Generate dates for the next 7 days
            const today = new Date();
            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            
            // Check for date in URL parameters
            const urlParams = new URLSearchParams(window.location.search);
            const urlDate = urlParams.get('date');
            
            for (let i = 0; i < 7; i++) {
                const date = new Date(today);
                date.setDate(today.getDate() + i);
                
                const dayName = days[date.getDay()];
                const dayNum = String(date.getDate()).padStart(2, '0');
                const monthNum = String(date.getMonth() + 1).padStart(2, '0');
                const dateString = `${dayNum}/${monthNum} (${dayName})`;
                const dateKey = `${date.getFullYear()}-${monthNum}-${dayNum}`;

                const dateBtn = document.createElement('button');
                
                // Determine if this button should be active
                let isActive = false;
                if (urlDate) {
                    isActive = (dateKey === urlDate);
                } else {
                    isActive = (i === 0);
                }
                
                dateBtn.className = 'date-btn' + (isActive ? ' active' : '');
                dateBtn.textContent = dateString;
                dateBtn.dataset.date = dateKey;
                
                if (isActive) currentDate = dateKey;

                dateBtn.addEventListener('click', function() {
                    document.querySelectorAll('.date-btn').forEach(btn => btn.classList.remove('active'));
                    this.classList.add('active');
                    currentDate = this.dataset.date;
                    document.getElementById('btnProceed').href = `schedule.html?date=${currentDate}`;
                    renderMeals();
                });

                dateSelector.appendChild(dateBtn);
            }
            
            // If urlDate was provided but not found in the next 7 days, default to today
            if (!currentDate) {
                const firstBtn = dateSelector.querySelector('.date-btn');
                if (firstBtn) {
                    firstBtn.classList.add('active');
                    currentDate = firstBtn.dataset.date;
                }
            }
            
            // Set initial href for the proceed button
            document.getElementById('btnProceed').href = `schedule.html?date=${currentDate}`;

            // Fetch meals from JSON file
            let meals = {
                breakfast: [],
                lunch: [],
                dinner: []
            };

            // Try to load from local file first (for development/demo purposes)
            // Note: In a real deployment, this would be a proper fetch() call.
            // Since we can't easily set up a server here, we'll embed the data via a script tag backup or improved error handling.
            
            fetch('meals.json')
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! Status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    meals = data;
                    renderMeals();
                })
                .catch(error => {
                    console.error('Error loading meals:', error);
                    // Fallback for local file access (CORS restrictions)
                    document.querySelector('.meal-schedule-content').innerHTML = 
                        '<div style="text-align: center; padding: 20px; color: #721c24; background-color: #f8d7da; border-color: #f5c6cb; border-radius: 5px;">' +
                        '<h3>Unable to load meal data</h3>' +
                        '<p>If you are opening this file directly in your browser, security settings may prevent loading the external JSON file.</p>' +
                        '<p>Please try running this via a local server (e.g., VS Code Live Server extension).</p>' +
                        '</div>';
                });

            function renderMealOptions(category, container, options) {
                container.innerHTML = '';
                const savedSelection = scheduleData[currentDate]?.[category] || '';

                options.forEach(option => {
                    const label = document.createElement('label');
                    label.className = 'meal-card';
                    
                    const input = document.createElement('input');
                    input.type = 'radio';
                    input.name = `meal_${category}`;
                    input.value = option.id;
                    input.className = 'meal-radio';
                    if (savedSelection === option.id) input.checked = true;

                    label.addEventListener('mousedown', function(e) {
                        e.preventDefault(); // Prevent default behavior

                        if (input.checked) {
                            input.checked = false; // Uncheck the input
                            if (scheduleData[currentDate]) {
                                delete scheduleData[currentDate][category]; // Remove from schedule data
                                localStorage.setItem('savvEatSchedule', JSON.stringify(scheduleData));
                            }
                        } else {
                            // Uncheck other options in the same category first (since it's a radio group, browser handles visual uncheck, but we need to update state)
                            // Actually, since we preventDefault on mousedown, the browser's native radio behavior is suppressed.
                            // So we need to manually uncheck other inputs if we want single selection per category.
                            
                            // Find all inputs in this container and uncheck them
                            const allInputs = container.querySelectorAll('input[type="radio"]');
                            allInputs.forEach(inp => inp.checked = false);

                            input.checked = true; // Check the input
                            if (!scheduleData[currentDate]) {
                                scheduleData[currentDate] = {};
                            }
                            scheduleData[currentDate][category] = option.id; // Update schedule data
                            localStorage.setItem('savvEatSchedule', JSON.stringify(scheduleData));
                        }
                        
                        // Small delay to allow UI update before any re-render logic if needed
                        // But we don't need to re-render the whole list here, just update the UI state.
                        // Re-rendering causes the list to flash or reset interactions.
                        // Instead of calling renderMeals(), we can just rely on the manual DOM updates we just did.
                    });

                    const cardContent = document.createElement('div');
                    cardContent.className = 'meal-card-content';

                    const img = document.createElement('img');
                    img.src = option.image;
                    img.alt = option.name;

                    const nameDiv = document.createElement('div');
                    nameDiv.className = 'meal-name';
                    nameDiv.textContent = option.name;

                    cardContent.appendChild(img);
                    cardContent.appendChild(nameDiv);
                    label.appendChild(input);
                    label.appendChild(cardContent);
                    container.appendChild(label);
                });
            }

            function getSeededRandom(seedStr) {
                // Create a numeric seed from the string
                let seed = 0;
                for (let i = 0; i < seedStr.length; i++) {
                    seed = ((seed << 5) - seed) + seedStr.charCodeAt(i);
                    seed |= 0; // Convert to 32bit integer
                }
                
                return function() {
                    const x = Math.sin(seed++) * 10000;
                    return x - Math.floor(x);
                };
            }

            function getDailyMeals(dateStr, allMeals) {
                const dailySelection = {};
                
                ['breakfast', 'lunch', 'dinner'].forEach(category => {
                    if (!allMeals[category]) {
                         dailySelection[category] = [];
                         return;
                    }
                    
                    // Create a unique seed for each category so they are independent
                    // This way adding a new breakfast item doesn't change lunch randomization
                    const rng = getSeededRandom(dateStr + category);
                    
                    // Clone array to avoid modifying original
                    const pool = [...allMeals[category]];
                    
                    // Fisher-Yates shuffle with seeded random
                    for (let i = pool.length - 1; i > 0; i--) {
                        const j = Math.floor(rng() * (i + 1));
                        [pool[i], pool[j]] = [pool[j], pool[i]];
                    }
                    
                    // Take first 3
                    dailySelection[category] = pool.slice(0, 3);
                });

                return dailySelection;
            }

            function renderMeals() {
                // Always fetch fresh data from localStorage to handle back-button navigation
                scheduleData = JSON.parse(localStorage.getItem('savvEatSchedule')) || {};
                
                // Get deterministic random meals for this specific date
                const dailyMeals = getDailyMeals(currentDate, meals);
                
                // Check if the currently saved selection is in the random list. if not, clear it or add it?
                // For now, we only show the 3 random options. If a user previously selected something else (and it's not in the list),
                // they won't see it selected. This is acceptable for a "simulated daily menu".
                
                renderMealOptions('breakfast', breakfastOptions, dailyMeals.breakfast);
                renderMealOptions('lunch', lunchOptions, dailyMeals.lunch);
                renderMealOptions('dinner', dinnerOptions, dailyMeals.dinner);
            }

            // Initial render
            renderMeals();

            // Handle Apply button
            btnApply.addEventListener('click', function() {
                const selectedBreakfast = document.querySelector('input[name="meal_breakfast"]:checked')?.value;
                const selectedLunch = document.querySelector('input[name="meal_lunch"]:checked')?.value;
                const selectedDinner = document.querySelector('input[name="meal_dinner"]:checked')?.value;

                if (!scheduleData[currentDate]) {
                    scheduleData[currentDate] = {};
                }

                if (selectedBreakfast) scheduleData[currentDate].breakfast = selectedBreakfast;
                if (selectedLunch) scheduleData[currentDate].lunch = selectedLunch;
                if (selectedDinner) scheduleData[currentDate].dinner = selectedDinner;

                localStorage.setItem('savvEatSchedule', JSON.stringify(scheduleData));
                
                // Optional: Show a brief success indication
                const originalText = btnApply.textContent;
                btnApply.textContent = 'Saved!';
                btnApply.style.backgroundColor = '#2E7D32';
                btnApply.style.borderColor = '#2E7D32';
                setTimeout(() => {
                    btnApply.textContent = originalText;
                    btnApply.style.backgroundColor = '';
                    btnApply.style.borderColor = '';
                }, 2000);
            });
        });
    </script>
</body>
</html>
