<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SavvEat</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="container">
            <nav class="navbar">
                <div class="logo">
                    <h2>Savv<span>Eat</span></h2>
                </div>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="#features">Features</a></li>
                    <li><a href="#how-it-works">How It Works</a></li>
                    <li><a href="#testimonials">Testimonials</a></li>
                    <li><a href="#download">Download</a></li>
                </ul>
                <div class="hamburger">
                    <i class="fas fa-bars"></i>
                </div>
            </nav>
        </div>
    </header>

    <!-- Weekly Meals Section -->
    <section class="weekly-meals">
        <div class="container">
            <div class="plans-header" style="display: flex; justify-content: space-between; align-items: center;">
                <h1>Weekly Meal Schedule</h1>
                <button id="editScheduleBtn" class="btn-secondary" style="background: none; border: none; cursor: pointer;">
                    <img src="https://static.thenounproject.com/png/687044-200.png" alt="Edit" style="width: 24px; height: 24px;">
                </button>
            </div>

            <!-- Weekly Meals Display Area -->
            <div class="weekly-meals-container" id="weeklyMealsContainer">
                <!-- Meals for the week will be injected here by JS -->
            </div>
        </div>
    </section>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const weeklyMealsContainer = document.getElementById('weeklyMealsContainer');
            const editScheduleBtn = document.getElementById('editScheduleBtn');

            // Load saved schedule data
            const savedData = localStorage.getItem('savvEatSchedule');
            const scheduleData = savedData ? JSON.parse(savedData) : {};

            let meals = { breakfast: [], lunch: [], dinner: [] };

            function getMealDetails(category, id) {
                if (!id) return null;
                return meals[category].find(m => m.id === id) || null;
            }

            function renderWeeklyMeals() {
                weeklyMealsContainer.innerHTML = '';

                const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
                const today = new Date();

                for (let i = 0; i < 7; i++) {
                    const date = new Date(today);
                    date.setDate(today.getDate() + i);

                    const dayName = days[date.getDay()];
                    const dateKey = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
                    const dayData = scheduleData[dateKey] || {};

                    const dayContainer = document.createElement('div');
                    dayContainer.className = 'day-container';

                    const dayHeader = document.createElement('h3');
                    dayHeader.textContent = `${dayName} (${dateKey})`;
                    dayContainer.appendChild(dayHeader);

                    const categories = [
                        { key: 'breakfast', label: 'Breakfast', colorClass: 'pill-teal' },
                        { key: 'lunch', label: 'Lunch', colorClass: 'pill-orange' },
                        { key: 'dinner', label: 'Dinner', colorClass: 'pill-brown' }
                    ];

                    categories.forEach(cat => {
                        const mealId = dayData[cat.key];
                        const mealDetails = getMealDetails(cat.key, mealId);

                        const pillContainer = document.createElement('div');
                        pillContainer.className = `schedule-pill ${cat.colorClass}`;

                        const labelDiv = document.createElement('div');
                        labelDiv.className = 'pill-label';
                        labelDiv.textContent = cat.label;

                        const contentDiv = document.createElement('div');
                        contentDiv.className = 'pill-content';

                        if (mealDetails) {
                            contentDiv.textContent = mealDetails.dishName;
                            
                            // Make the whole pill clickable if a meal is selected
                            pillContainer.style.cursor = 'pointer';
                            pillContainer.addEventListener('click', function() {
                                // Redirect to details page with meal ID
                                window.location.href = `details.html?id=${mealDetails.id}`;
                            });
                        } else {
                            contentDiv.textContent = '- No meal planned -';
                            contentDiv.classList.add('empty-meal');
                        }

                        pillContainer.appendChild(labelDiv);
                        pillContainer.appendChild(contentDiv);
                        dayContainer.appendChild(pillContainer);
                    });

                    weeklyMealsContainer.appendChild(dayContainer);
                }
            }

            // Fetch meals.json and render
            fetch('meals.json')
                .then(response => response.json())
                .then(data => {
                    meals = data.menu;
                    renderWeeklyMeals();
                })
                .catch(error => {
                    console.error('Error loading meals:', error);
                    renderWeeklyMeals();
                });

            // Edit button logic
            editScheduleBtn.addEventListener('click', function() {
                window.location.href = 'plans.html';
            });
        });
    </script>
</body>
</html>
